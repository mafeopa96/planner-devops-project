# ArgoCD Application — le dice a ArgoCD qué desplegar y desde dónde
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mi-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/TU_USUARIO/TU_REPO
    targetRevision: main
    path: argocd/k8s/manifests     # carpeta con los manifests de Kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: produccion

  syncPolicy:
    automated:
      prune: true        # elimina recursos huérfanos no presentes en Git
      selfHeal: true     # corrige cambios manuales no autorizados en el cluster
    syncOptions:
      - CreateNamespace=true
